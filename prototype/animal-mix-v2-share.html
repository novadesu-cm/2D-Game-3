<title>Animal Mix Farm v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Prototype v2: one loop. Animals make ingredients -> throw into one pot -> sell dishes -> buy more. Stash holds spare animals; any animal can be sold. Emoji, no art. */
:root{--bg:#eaf0e4;--panel:#fafcf6;--fg:#1d2a1c;--muted:#58684f;--line:#cbd8c2;--accent:#3d7a38;--accent-fg:#fff;--warn:#a8501a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111a13;--panel:#1a261d;--fg:#e4eedf;--muted:#98ad90;--line:#2e4132;--accent:#74c26b;--accent-fg:#0c180e;--warn:#e69a62;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111a13;--panel:#1a261d;--fg:#e4eedf;--muted:#98ad90;--line:#2e4132;--accent:#74c26b;--accent-fg:#0c180e;--warn:#e69a62;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 'Noto Sans Thai',system-ui,sans-serif;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:920px;margin:0 auto;display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:760px){.app{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
h3{margin:0;font-size:15px}
.big{font:700 26px 'Mali',system-ui;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:12px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;min-height:34px}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.on{outline:2px solid var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{border:2px solid var(--line);border-radius:10px;background:var(--panel);min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;font-size:12px;gap:2px;position:relative;min-width:0}
.slot .em{font-size:26px;line-height:1}
.slot .pl{position:absolute;top:3px;right:5px;font-size:12px;font-weight:700}
.slot.has{border-color:var(--accent)}
.slot.br{opacity:.55}
.slot.pick{outline:3px solid var(--warn)}
.slot.sel{outline:3px solid var(--accent)}
.slot.lock{opacity:.35;border-style:dashed}
.slot.empty{border-style:dashed;color:var(--muted)}
.slot:disabled{cursor:default}
.bar{height:6px;width:86%;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.bar.w i{background:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:34px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--panel);font-size:15px}
.chip:disabled{opacity:.45}
.pot{min-height:96px;border:2px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:8px}
.pot.on{border-style:solid;border-color:var(--accent)}
.pot .items{font-size:22px;letter-spacing:.04em}
.pot .t{font:700 22px 'Mali',system-ui;font-variant-numeric:tabular-nums}
.line{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:4px 0}
.line:last-child{border-bottom:0}
.msg{min-height:2.6em;font-size:13px;color:var(--muted)}
.msg div:first-child{color:var(--fg)}
.info{border:1px solid var(--accent);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
</style>
<div class="app" id="app"></div>
<script>
(()=>{'use strict';
const KEY='animal_mix_v2';
/* animals: out = ingredient emoji, val = value per item, iv = seconds per item, price = sell price */
const A={
 hen:{n:'ไก่',e:'🐔',out:'🥚',val:6,iv:6,tier:0,price:20},
 duck:{n:'เป็ด',e:'🦆',out:'🥚',val:6,iv:7,tier:0,price:20},
 sheep:{n:'แกะ',e:'🐑',out:'🥛',val:6,iv:6,tier:0,price:20},
 goose:{n:'ห่าน',e:'🦢',out:'🥚',val:24,iv:8,tier:1,price:120},
 cow:{n:'วัว',e:'🐄',out:'🥛',val:24,iv:9,tier:1,price:120},
 elephant:{n:'ช้าง',e:'🐘',out:'🌰',val:96,iv:12,tier:2,price:600}};
const KINDS=Object.keys(A);
const SHOP=['hen','duck','sheep'], BUY=30;
/* hidden breeding table: never shown to the player */
const RECIPE={'duck+hen':'goose','hen+sheep':'cow','cow+goose':'elephant'};
/* cooking ladder: total value in the pot -> dish. The thresholds are not shown anywhere. */
const LADDER=[[10,'ไข่ต้ม','🥚'],[20,'ไข่คน','🍳'],[40,'ไข่เจียว','🥞'],[80,'คัสตาร์ด','🍮'],[160,'ออมเล็ต','🍄'],[320,'ข้าวผัด','🍛'],[640,'ซุปครีม','🍲'],[1280,'ชีสเค้ก','🍰']];
const COOK=5, BAG=30, PILE=5, MAXSLOTS=12, START_SLOTS=4, START_STASH=4, MAXSTASH=12;
const ing=k=>A[k].out+A[k].val;               // ingredient key, e.g. '🥚6'
const ING={};KINDS.forEach(k=>{ING[ing(k)]={e:A[k].out,v:A[k].val}});
const tierOf=T=>{let t=-1;LADDER.forEach((l,i)=>{if(T>=l[0])t=i});return t};

let S,mode=false,lastSig='';
const fresh=()=>{
  S={t:0,coins:40,uid:1,farm:[],
  stash:[],stashCap:START_STASH,unlocked:START_SLOTS,bag:{},pot:null,dishes:{},sold:0,breed:[],job:null,waiting:[],found:{},throwQty:1,sel:null,msgs:[],lastReal:Date.now()};
  S.farm=[mk('hen'),mk('duck'),mk('sheep'),null,null,null,null,null,null,null,null,null];
  return S};
function mk(k){return{id:S.uid++,k,pile:0,prog:0,busy:false}}
const save=()=>{try{S.lastReal=Date.now();localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const load=()=>{try{const j=localStorage.getItem(KEY);if(j){S=JSON.parse(j);return true}}catch(e){}return false};
const msg=m=>{S.msgs.unshift(`[${fmtT(S.t)}] ${m}`);S.msgs.length=Math.min(S.msgs.length,3)};
const fmt=n=>{if(n<1000)return n<10&&n%1?n.toFixed(1):Math.floor(n)+'';const u=['K','M','B'];let i=-1;while(n>=1000&&i<u.length-1){n/=1000;i++}return n.toFixed(n<10?2:n<100?1:0)+u[i]};
const fmtT=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const bagN=()=>Object.values(S.bag).reduce((a,b)=>a+b,0);
const emptyIdx=()=>S.farm.findIndex((s,i)=>i<S.unlocked&&!s);
const slotCost=()=>Math.round(80*Math.pow(2.5,S.unlocked-START_SLOTS));
const stashCost=()=>Math.round(100*Math.pow(2,S.stashCap-START_STASH));
/* find an animal by id: returns {loc, idx, a} */
function find(id){
  let i=S.farm.findIndex(a=>a&&a.id===id);if(i>=0)return{loc:'farm',idx:i,a:S.farm[i]};
  i=S.stash.findIndex(a=>a.id===id);if(i>=0)return{loc:'stash',idx:i,a:S.stash[i]};
  return null;
}
const selA=()=>S.sel?find(S.sel.id):null;

/* ---------- simulation ---------- */
function finishPot(){
  const p=S.pot,T=Object.keys(p.items).reduce((a,k)=>a+p.items[k]*ING[k].v,0),t=tierOf(T);
  S.pot=null;
  if(t<0){for(const k in p.items)S.bag[k]=(S.bag[k]||0)+p.items[k];msg('ของน้อยเกินไป ยังไม่ได้อาหาร (ของคืนเข้ากระเป๋า)');return}
  const d=S.dishes[t]||(S.dishes[t]={n:0,v:0});
  d.n++;d.v+=T*(1.2+.1*t);
  msg(`ได้ ${LADDER[t][2]} ${LADDER[t][1]}`);
}
function placeNew(k){
  const e=emptyIdx();
  if(e>=0){S.farm[e]=mk(k);return}
  if(S.stash.length<S.stashCap){S.stash.push(mk(k));return}
  S.waiting.push(k);
}
function finishJob(){
  const j=S.job,key=[j.ka,j.kb].sort().join('+'),res=RECIPE[key]||(Math.random()<.5?j.ka:j.kb);
  for(const id of [j.ida,j.idb]){const f=find(id);if(f)f.a.busy=false}
  S.job=null;
  if(RECIPE[key])S.found[res]=1;
  msg(`🐣 ได้ ${A[res].e} ${A[res].n}`);
  placeNew(res);
}
function sim(dt){
  S.t+=dt;
  for(let i=0;i<S.unlocked;i++){
    const s=S.farm[i];if(!s||s.busy)continue;
    s.prog+=dt;
    while(s.prog>=A[s.k].iv&&s.pile<PILE){s.prog-=A[s.k].iv;s.pile++}
    if(s.pile>=PILE)s.prog=0;
  }
  if(S.pot&&S.t>=S.pot.end)finishPot();
  if(S.job&&S.t>=S.job.end)finishJob();
  while(S.waiting.length&&(emptyIdx()>=0||S.stash.length<S.stashCap)){placeNew(S.waiting.shift())}
}
function simSpan(g,m){const d=Math.max(m,g/200);let r=g;while(r>1e-9){const x=Math.min(d,r);sim(x);r-=x}}

/* ---------- actions ---------- */
function collectOne(s){
  if(!s||!s.pile)return;
  const k=ing(s.k);
  while(s.pile>0&&bagN()<BAG){s.pile--;S.bag[k]=(S.bag[k]||0)+1}
  if(s.pile>0)msg('กระเป๋าเต็ม');
}
function collectFarm(i){collectOne(S.farm[i])}
function throwIt(key,qty){
  const n=Math.min(qty,S.bag[key]||0);if(n<=0)return;
  if(!S.pot)S.pot={items:{},start:S.t,end:S.t+COOK};
  S.pot.items[key]=(S.pot.items[key]||0)+n;
  S.bag[key]-=n;if(S.bag[key]<=0)delete S.bag[key];
}
function sellDishes(){
  const v=Object.values(S.dishes).reduce((a,d)=>a+d.v,0),n=Object.values(S.dishes).reduce((a,d)=>a+d.n,0);
  if(!n)return;S.coins+=v;S.sold+=n;S.dishes={};msg(`💰 ขาย ${n} จาน +${fmt(v)}`);
}
function buyAnimal(k){
  if(S.coins<BUY){msg('เงินไม่พอ');return}
  const e=emptyIdx();
  if(e<0&&S.stash.length>=S.stashCap){msg('ไม่มีที่ว่าง (ฟาร์มและช่องเก็บเต็ม)');return}
  S.coins-=BUY;
  if(e>=0)S.farm[e]={id:S.uid++,k,pile:0,prog:0,busy:false};else S.stash.push({id:S.uid++,k,pile:0,prog:0,busy:false});
}
function buySlot(){
  if(S.unlocked>=MAXSLOTS)return;
  const c=slotCost();if(S.coins<c){msg('เงินไม่พอ');return}
  S.coins-=c;S.unlocked++;
}
function buyStash(){
  if(S.stashCap>=MAXSTASH)return;
  const c=stashCost();if(S.coins<c){msg('เงินไม่พอ');return}
  S.coins-=c;S.stashCap++;
}
function toStash(){
  const f=selA();if(!f||f.loc!=='farm'||f.a.busy)return;
  if(S.stash.length>=S.stashCap){msg('ช่องเก็บเต็ม');return}
  collectOne(f.a);
  S.farm[f.idx]=null;f.a.pile=0;f.a.prog=0;S.stash.push(f.a);S.sel=null;
}
function toFarm(){
  const f=selA();if(!f||f.loc!=='stash'||f.a.busy)return;
  const e=emptyIdx();if(e<0){msg('ฟาร์มไม่มีช่องว่าง');return}
  S.stash.splice(f.idx,1);f.a.pile=0;f.a.prog=0;S.farm[e]=f.a;S.sel=null;
}
function sellSel(){
  const f=selA();if(!f||f.a.busy)return;
  const p=A[f.a.k].price;
  if(f.loc==='farm')S.farm[f.idx]=null;else S.stash.splice(f.idx,1);
  S.coins+=p;msg(`💰 ขาย ${A[f.a.k].e} ${A[f.a.k].n} +${p}`);S.sel=null;
  S.breed=S.breed.filter(id=>id!==f.a.id);
}
const topTier=()=>S.breed.length?Math.max(...S.breed.map(id=>{const f=find(id);return f?A[f.a.k].tier:0})):0;
const breedCost=()=>40*(1+topTier());
const breedTime=()=>20+20*topTier();
function toggleBreed(id){
  const f=find(id);if(!f||f.a.busy)return;
  const j=S.breed.indexOf(id);
  if(j>=0)S.breed.splice(j,1);else if(S.breed.length<2)S.breed.push(id);
}
function startBreed(){
  if(S.job||S.breed.length<2)return;
  const fa=find(S.breed[0]),fb=find(S.breed[1]);if(!fa||!fb)return;
  const c=breedCost();if(S.coins<c){msg('เงินไม่พอสำหรับการผสม');return}
  S.coins-=c;fa.a.busy=true;fb.a.busy=true;
  S.job={ida:fa.a.id,idb:fb.a.id,ka:fa.a.k,kb:fb.a.k,start:S.t,end:S.t+breedTime()};
  S.breed=[];mode=false;
}
function act(a,v){
  switch(a){
  case'collectAll':for(let i=0;i<S.unlocked;i++)collectFarm(i);break;
  case'farm':{const s=S.farm[+v];if(!s)break;if(mode)toggleBreed(s.id);else S.sel=(S.sel&&S.sel.id===s.id)?null:{loc:'farm',id:s.id};break}
  case'stash':{const s=S.stash[+v];if(!s)break;if(mode)toggleBreed(s.id);else S.sel=(S.sel&&S.sel.id===s.id)?null:{loc:'stash',id:s.id};break}
  case'mode':mode=!mode;S.breed=[];S.sel=null;break;
  case'throw':throwIt(v,S.throwQty);break;
  case'throwAll':for(const k of Object.keys(S.bag))throwIt(k,1e9);break;
  case'qty':S.throwQty=+v;break;
  case'sellDishes':sellDishes();break;
  case'buy':buyAnimal(v);break;
  case'buySlot':buySlot();break;
  case'buyStash':buyStash();break;
  case'toStash':toStash();break;
  case'toFarm':toFarm();break;
  case'sellSel':sellSel();break;
  case'breed':startBreed();break;
  case'reset':try{localStorage.removeItem(KEY)}catch(e){}S=fresh();mode=false;break;
  }
  sim(0);save();lastSig='';render();
}

/* ---------- render ---------- */
const perMin=()=>S.farm.reduce((a,s,i)=>a+(s&&i<S.unlocked&&!s.busy?60/A[s.k].iv:0),0);
const sig=()=>JSON.stringify([S.unlocked,S.farm,S.stash,S.stashCap,S.bag,S.pot&&Object.keys(S.pot.items).map(k=>k+S.pot.items[k]),S.dishes,S.breed,S.job&&1,S.waiting,S.sel,mode,S.throwQty,Math.floor(S.coins),S.sold]);
function animalCell(s,attrs,extra=''){
  const a=A[s.k],picked=S.breed.includes(s.id),sel=S.sel&&S.sel.id===s.id;
  return`<button class="slot has ${s.busy?'br':''} ${picked?'pick':''} ${sel?'sel':''}" ${attrs} ${s.busy?'disabled':''}>
    <span class="em">${a.e}</span><span class="sub">${a.n}</span>${s.pile?`<span class="pl">${s.pile}</span>`:''}
    ${s.busy?'<span class="sub">ผสมอยู่</span>':extra}</button>`;
}
function farmHTML(i){
  if(i>=S.unlocked){
    if(i===S.unlocked&&S.unlocked<MAXSLOTS)return`<button class="slot lock" data-a="buySlot">＋ ช่อง<br>🪙${fmt(slotCost())}</button>`;
    return`<div class="slot lock">🔒</div>`;
  }
  const s=S.farm[i];
  if(!s)return`<div class="slot empty">ว่าง</div>`;
  return animalCell(s,`data-a="farm" data-v="${i}"`,`<div class="bar"><i data-p="${s.id}"></i></div>`);
}
function stashHTML(){
  const cells=S.stash.map((s,i)=>animalCell(s,`data-a="stash" data-v="${i}"`,'')).join('');
  const empty=Array.from({length:S.stashCap-S.stash.length},()=>`<div class="slot empty">·</div>`).join('');
  return`<div class="grid4">${cells}${empty}</div>`;
}
function infoHTML(){
  const f=selA();if(!f)return'';
  const a=A[f.a.k],where=f.loc==='farm'?'ในฟาร์ม':'ในช่องเก็บ';
  return`<div class="info"><div><b>${a.e} ${a.n}</b> <span class="sub">${where}${f.a.busy?' · ผสมอยู่':''}</span></div>
    <div class="row">${f.loc==='farm'?`<button class="btn" data-a="toStash" ${f.a.busy||S.stash.length>=S.stashCap?'disabled':''}>ย้ายไปช่องเก็บ</button>`:`<button class="btn" data-a="toFarm" ${f.a.busy||emptyIdx()<0?'disabled':''}>ย้ายลงฟาร์ม</button>`}
    <button class="btn pri" data-a="sellSel" ${f.a.busy?'disabled':''}>ขาย 🪙${a.price}</button></div></div>`;
}
function render(){
  const app=document.getElementById('app');
  const dishes=Object.keys(S.dishes).sort((x,y)=>y-x).map(t=>`<div class="line"><span>${LADDER[t][2]} ${LADDER[t][1]} ×${S.dishes[t].n}</span><span class="sub">🪙${fmt(S.dishes[t].v)}</span></div>`).join('')||'<div class="sub">ยังไม่มีอาหารขาย</div>';
  const dishTotal=Object.values(S.dishes).reduce((a,d)=>a+d.v,0),dishN=Object.values(S.dishes).reduce((a,d)=>a+d.n,0);
  const chips=Object.keys(S.bag).map(k=>`<button class="chip" data-a="throw" data-v="${k}" title="มูลค่า ${ING[k].v}">${ING[k].e}×${S.bag[k]}</button>`).join('')||'<span class="sub">กระเป๋าว่าง</span>';
  const qty=[[1,'×1'],[5,'×5'],[1e9,'ทั้งหมด']].map(([n,l])=>`<button class="btn ${S.throwQty===n?'pri':''}" data-a="qty" data-v="${n}">${l}</button>`).join(' ');
  const pot=S.pot?`<div class="pot on"><div class="items">${Object.keys(S.pot.items).map(k=>ING[k].e+'×'+S.pot.items[k]).join(' ')}</div><div class="t" data-t="${S.pot.end}"></div><div class="bar" style="width:86%"><i data-pot="1"></i></div><span class="sub">โยนเพิ่มได้จนกว่าจะเสร็จ</span></div>`:`<div class="pot"><span class="sub">หม้อว่าง โยนของเพื่อเริ่มปรุง</span></div>`;
  const job=S.job?`<div class="line"><span>🐣 กำลังผสม…</span><span class="t" data-t="${S.job.end}"></span></div><div class="bar w"><i data-job="1"></i></div>`:'';
  const canBreed=!S.job&&S.breed.length===2;
  const sel=S.breed.map(id=>{const f=find(id);return f?A[f.a.k].e:''}).join(' + ')||'เลือกสัตว์ 2 ตัว';
  app.innerHTML=`
  <div class="box wide"><div class="row" style="justify-content:space-between"><div><div class="sub">เงิน</div><div class="big">🪙 <span id="coins">${fmt(S.coins)}</span></div></div>
    <button class="btn" data-a="reset">เริ่มใหม่</button></div>
    <div class="msg">${S.msgs.map(m=>`<div>${m}</div>`).join('')}</div></div>
  <div class="box"><div class="row" style="justify-content:space-between"><h3>ฟาร์ม</h3><span class="sub">ผลิตอยู่ ~${perMin().toFixed(1)} ชิ้น/นาที</span><button class="btn" data-a="collectAll">📦 เก็บทั้งหมด</button></div>
    <div class="grid4">${Array.from({length:MAXSLOTS},(_,i)=>farmHTML(i)).join('')}</div>
    ${infoHTML()}</div>
  <div class="box"><div class="row" style="justify-content:space-between"><h3>ช่องเก็บสัตว์ ${S.stash.length}/${S.stashCap}</h3><button class="btn" data-a="buyStash" ${S.stashCap>=MAXSTASH?'disabled':''}>+ ช่องเก็บ 🪙${fmt(stashCost())}</button></div>
    ${stashHTML()}</div>
  <div class="box"><h3>โยนลงหม้อ</h3>
    <div class="row">${qty}<span style="flex:1"></span><button class="btn pri" data-a="throwAll" ${bagN()?'':'disabled'}>โยนทั้งหมด</button></div>
    <div class="chips">${chips}</div>${pot}</div>
  <div class="box"><div class="row" style="justify-content:space-between"><h3>ขาย</h3><button class="btn pri" data-a="sellDishes" ${dishN?'':'disabled'}>ขายอาหารทั้งหมด 🪙${fmt(dishTotal)}</button></div>
    ${dishes}</div>
  <div class="box"><div class="row" style="justify-content:space-between"><h3>ผสมพันธุ์</h3><button class="btn ${mode?'on':''}" data-a="mode">${mode?'กำลังเลือกผสม (กดเพื่อปิด)':'โหมดเลือกผสม'}</button></div>
    <div class="sub">${mode?'แตะสัตว์ในฟาร์มหรือช่องเก็บ 2 ตัว':''} ${sel}</div>
    <div class="row"><button class="btn pri" data-a="breed" ${canBreed&&S.coins>=breedCost()?'':'disabled'}>ผสม 🪙${fmt(breedCost())}</button><span class="sub">ใช้เวลา ${fmtT(breedTime())}</span></div>
    ${job}</div>
  <div class="box"><h3>ซื้อ</h3>
    <div class="row">${SHOP.map(k=>`<button class="btn" data-a="buy" data-v="${k}" ${S.coins>=BUY?'':'disabled'}>${A[k].e} ${A[k].n} 🪙${BUY}</button>`).join('')}</div>
    <div class="sub">${S.waiting.length?`รอที่ว่าง: ${S.waiting.map(k=>A[k].e).join(' ')}`:'&nbsp;'}</div></div>`;
  tickUI();
}
function tickUI(){
  const c=document.getElementById('coins');if(c)c.textContent=fmt(S.coins);
  document.querySelectorAll('[data-p]').forEach(el=>{const f=find(+el.dataset.p);if(f&&f.loc==='farm')el.style.width=Math.min(100,100*f.a.prog/A[f.a.k].iv)+'%'});
  document.querySelectorAll('[data-pot]').forEach(el=>{if(S.pot)el.style.width=Math.min(100,100*(S.t-S.pot.start)/COOK)+'%'});
  document.querySelectorAll('[data-job]').forEach(el=>{if(S.job)el.style.width=Math.min(100,100*(S.t-S.job.start)/Math.max(1,S.job.end-S.job.start))+'%'});
  document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=fmtT(+el.dataset.t-S.t)});
}
let lastPress=0;
document.addEventListener('pointerdown',()=>{lastPress=Infinity});
document.addEventListener('pointerup',()=>{lastPress=performance.now()});
document.addEventListener('pointercancel',()=>{lastPress=performance.now()});
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&!el.disabled)act(el.dataset.a,el.dataset.v)});

/* ---------- boot + loop ---------- */
if(!load())S=fresh();
S.waiting=S.waiting||[];S.found=S.found||{};S.stash=S.stash||[];S.stashCap=S.stashCap||START_STASH;
{const el=(Date.now()-S.lastReal)/1000;if(el>10)simSpan(Math.min(el,3*3600),1)}
render();
let last=performance.now(),sv=0;
setInterval(()=>{
  const now=performance.now(),dt=Math.min(600,(now-last)/1000);last=now;
  simSpan(dt,.5);
  const s=sig();if(s!==lastSig&&performance.now()-lastPress>600){lastSig=s;render()}else tickUI();
  sv+=dt;if(sv>5){sv=0;save()}
},250);
window.__G={get S(){return S},act,simSpan,A,RECIPE,ING,LADDER,tierOf,render,setMode:v=>{mode=v}};
})();
</script>
