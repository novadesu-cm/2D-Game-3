<title>Animal Mix Farm</title>

<style>
/* Layout: one narrow column (~420px) that mimics the side-screen window. Status + farm grid on top, tabbed panels below. */
:root{
  --bg:#eaf0e4; --panel:#fafcf6; --fg:#1d2a1c; --muted:#58684f; --line:#cbd8c2;
  --accent:#3d7a38; --accent-fg:#ffffff; --warn:#a8501a; --ok:#2c7a46; --water:#2a78c2;
  --r0:#7a8975; --r1:#26896a; --r2:#2a68b3; --r3:#8643b2; --r4:#c27d0a;
  --font-d:'Mali','Noto Sans Thai',system-ui,sans-serif; --font-b:'Noto Sans Thai',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111a13; --panel:#1a261d; --fg:#e4eedf; --muted:#98ad90; --line:#2e4132;
  --accent:#74c26b; --accent-fg:#0c180e; --warn:#e69a62; --ok:#6fd08c; --water:#5fa8ee;
  --r0:#93a38e; --r1:#4fc4a0; --r2:#6fa5ee; --r3:#b98be0; --r4:#e8aa3b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111a13; --panel:#1a261d; --fg:#e4eedf; --muted:#98ad90; --line:#2e4132;
  --accent:#74c26b; --accent-fg:#0c180e; --warn:#e69a62; --ok:#6fd08c; --water:#5fa8ee;
  --r0:#93a38e; --r1:#4fc4a0; --r2:#6fa5ee; --r3:#b98be0; --r4:#e8aa3b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-b);padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.coins{font:700 22px var(--font-d);font-variant-numeric:tabular-nums}

.sub{color:var(--muted);font-size:12px}

.hint{background:color-mix(in srgb,var(--accent) 14%,var(--panel));border-color:var(--accent);font-size:13px}
.farm{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  min-height:76px;padding:4px 2px;border:2px solid var(--rc,var(--line));border-radius:8px;background:var(--panel);min-width:0}
.cell .em{font-size:26px;line-height:1.1}

.act{display:flex;flex-direction:column;gap:8px}

.btns{display:flex;flex-wrap:wrap;gap:6px}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

/* one-screen layout */
html,body{height:100%;margin:0}

#app{max-width:none;margin:0;min-height:100%;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-content:start}

.farm .cell{min-height:60px}

.top{gap:6px}
.res{gap:10px;flex-wrap:wrap;align-items:center}
.mb{display:inline-flex;align-items:center;gap:4px;font-size:12px}

.msg1{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:16px}
.hintbar{font-size:12px;color:var(--accent);font-weight:600}
.act1{min-height:84px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel)}
.act1 .rt2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.slot3{min-height:34px;font-size:18px}
.line{padding:3px 0;gap:6px}
.pots{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px}
.pot{display:inline-flex;align-items:center;gap:4px}
.pot .bar{width:54px;height:6px}
.counter{display:flex;flex-direction:column;overflow:auto;max-height:150px}
.potz{padding:6px}
.row.nowrap{flex-wrap:nowrap}
.pair{gap:6px}
.pair .cell{flex:none;width:48px}
.tabs{gap:4px}
.tab{padding:3px 8px;font-size:12px;border-radius:7px}
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(520px,100%);max-height:min(88vh,720px);display:flex;flex-direction:column;overflow:hidden}
.mbox .mh{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.mbody{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
@media (min-width:820px){
  body{overflow:hidden}
  #app{height:100%;min-height:0;grid-template-columns:minmax(300px,1.05fr) minmax(270px,1fr) minmax(250px,.85fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"head head head" "farm kit side" "stash stash stash";align-content:stretch}
  .a-head{grid-area:head}.a-farm{grid-area:farm;min-height:0}.a-kit{grid-area:kit;min-height:0}.a-side{grid-area:side;display:flex;flex-direction:column;min-height:0}.a-stash{grid-area:stash}
  .a-kit .kit{height:100%;display:flex;flex-direction:column;gap:6px;min-height:0}
  .a-kit .counter{flex:1;min-height:40px;max-height:none}
  .sgrid{max-height:104px}
}
</style>

<div id="app"></div>

<script>
(()=>{
'use strict';
/* ---------- data ---------- */
const RAR=['สามัญ','พิเศษ','หายาก','มหากาพย์','ตำนาน'];
const ROLE={P:{n:'ผู้ผลิต',i:'🪙'},B:{n:'ผู้หนุน',i:'📣'},Br:{n:'ผู้เร่งผสม',i:'💞'},S:{n:'ผู้เร่งสำรวจ',i:'🧭'},K:{n:'ผู้เฝ้าฟาร์ม',i:'🏠'}};
// [name, emoji, rarity, roles, parent indices]
const RAW=[
['ไก่','🐔',0,['P']],['เป็ด','🦆',0,['P']],['แกะ','🐑',0,['P']],['กระต่าย','🐇',0,['B']],['หนู','🐭',0,['S']],['กบ','🐸',0,['Br']],['หอยทาก','🐌',0,['K']],
['ห่าน','🦢',1,['P'],[0,1]],['อัลปาก้า','🦙',1,['P'],[2,3]],['แฮมสเตอร์','🐹',1,['B'],[4,3]],['นากน้ำ','🦦',1,['S'],[1,5]],['ซาลาแมนเดอร์','🦎',1,['Br'],[5,6]],['เต่า','🐢',1,['K'],[6,2]],
['นกยูง','🦚',2,['B'],[7,0]],['แกะขนทอง','🐏',2,['P'],[8,2]],['บีเวอร์','🦫',2,['P'],[10,9]],['นกฮูก','🦉',2,['S'],[9,7]],['กบสายรุ้ง','🌈',2,['Br'],[11,10]],['เต่าทะเลยักษ์','🐊',2,['K'],[12,11]],
['ฟีนิกซ์','🔥',3,['B'],[13,16]],['กวางทองคำ','🦌',3,['P'],[14,15]],['อินทรีฟ้า','🦅',3,['S'],[16,15]],['ปลาคราฟทอง','🐠',3,['Br'],[17,18]],['เต่าพิภพ','🌏',3,['K'],[18,14]],
['นาค','🐉',4,['Br','K'],[22,23]],['กินรี','🧚',4,['P','B'],[19,20]],['ครุฑ','🪽',4,['S','B'],[21,19]]];
const SP=RAW.map(r=>({n:r[0],em:r[1],rar:r[2],roles:r[3],par:r[4]||null}));
const RC={}; SP.forEach((s,i)=>{if(s.par)RC[[...s.par].sort((a,b)=>a-b).join('-')]=i});
/* ผลผลิตของสัตว์ผู้ผลิตแต่ละชนิด: [ตระกูล, ชื่อ, emoji] */
const FAM={E:{n:'ไข่',i:'🥚'},M:{n:'นม',i:'🥛'},W:{n:'ของป่า',i:'🌰'}};
const PR={0:['E','ไข่ไก่','🥚'],1:['E','ไข่เป็ด','🥚'],2:['M','นมแกะ','🥛'],7:['E','ไข่ห่าน','🥚'],8:['M','นมอัลปาก้า','🥛'],
  14:['M','นมแกะทอง','🥛'],15:['W','ถั่วป่า','🌰'],20:['W','เห็ดทอง','🍄'],25:['W','ดอกไม้ทิพย์','🌸']};
const DISH={EE:['ไข่เจียว','🍳'],EM:['คัสตาร์ด','🍮'],EW:['ออมเล็ตเห็ด','🥞'],MM:['ชีส','🧀'],MW:['ซุปครีม','🍲'],WW:['ผัดป่า','🥘'],
  EEE:['ไข่ตุ๋น','🍥'],EEM:['พุดดิ้ง','🍧'],EEW:['ข้าวไข่เจียว','🍛'],EMM:['ชีสเค้ก','🍰'],EMW:['พายสามสหาย','🥧'],EWW:['สเต็กไข่เห็ด','🥩'],
  MMM:['เนยแท้','🧈'],MMW:['ซุปชีส','🍜'],MWW:['ราดหน้าป่า','🍝'],WWW:['สลัดป่า','🥗']};
/* สูตรลับ: ใช้ผลผลิตของสัตว์ "ชนิดเจาะจง" (ไม่ใช่แค่ตระกูล) ตัวคูณสูงกว่าสูตรตระกูล ต้องลองปรุงถึงจะค้นพบ */
const SIGLIST=[[[0,2],'ไข่ตุ๋นนม','🍮',2.6],[[1,15],'ไข่เค็มถั่ว','🥠',2.6],[[2,15],'ซุปถั่วนม','🍵',2.6],[[7,14],'คัสตาร์ดทอง','🍯',3.4],
  [[8,20],'ซุปเห็ดทอง','🥣',3.6],[[0,1,7],'ไข่สามสหาย','🍳',3.4],[[20,25],'สลัดทิพย์','🌺',4.5],[[7,14,20],'พายราชา','👑',5],[[7,14,25],'พายทิพย์','🎂',6]];
const SIG={},SIGN={};SIGLIST.forEach(([ids,n,e,m])=>{const k='S'+ids.join('-');SIG[k]={ids,n,e,m};SIGN[k]=[n,e]});
const dinfo=k=>DISH[k]||SIGN[k]||['?','🍽'];
const ORDER_MULT=2.5, SAT_STEP=.07, SAT_DECAY=.0035;
const V=[6,24,96,384,1536], INT=[8,10,12,14,16];
const BOOST=[.1,.2,.35,.6,1], HASTE=[.03,.06,.1,.15,.2], OFFH=[.5,1,2,4,8], KST=[1,2,3,5,8];
const STAR=[1,1.5,2.25], NTIME=[20,120,600,3600,14400], NCOST=[10,50,1500,60000,3e6];
const ESS=[1,3,8,20,50], DEMAND_MULT=1.6, RAW_MULT=.5, COOK_PER_ITEM=4;
const ZONES=[{n:'ทุ่งหญ้า',need:0,dur:30,coin:40},{n:'ลำธาร',need:6,dur:1800,coin:300},{n:'ป่าลึก',need:12,dur:7200,coin:3000},{n:'ภูผาเมฆ',need:18,dur:21600,coin:30000},{n:'ถ้ำนาคา',need:24,dur:43200,coin:300000}];
const KEY='amf_proto_v3';

/* ---------- state ---------- */
let S, sel=null, tab='', zoneSel=0, speed=1, pressed=false;
const fresh=()=>({v:3,t:0,coins:0,ess:0,unlocked:3,stashLvl:0,uid:1,farm:Array(12).fill(null),stash:[],away:[],
  codex:{},shiny:{},known:{},tried:{},nur:{a:null,b:null,end:null},crew:[],exp:null,pity:0,acts:0,explored:0,nursed:0,
  bag:{},draft:[],pots:[null,null,null,null],counter:{},dishes:{},u:{},sat:{},order:null,orderNext:60,orders:0,demand:[],demandEnd:0,
  droneT:0,cashT:0,chefWait:0,sales:[],sold:0,earned:0,mCollect:0,mCook:0,mSell:0,aCollect:0,aCook:0,aSell:0,
  lastPair:null,lastZone:0,auto:{nur:true,exp:true,rel:true},autoT:0,
  log:[],msgs:[],lastReal:Date.now(),created:Date.now()});
const mk=sp=>({id:S.uid++,sp,star:1,shiny:false,busy:null,prog:0,pile:0});
function load(){try{const j=localStorage.getItem(KEY);if(j){S=JSON.parse(j);return true}}catch(e){}return false}
function save(){try{S.lastReal=Date.now();localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function init(){
  S=fresh();S.coins=60;
  [0,1,2].forEach((sp,i)=>{S.farm[i]=mk(sp);S.codex[sp]=1});
  rollDemand();
}

/* ---------- helpers ---------- */
const sp=a=>SP[a.sp], rar=a=>SP[a.sp].rar, has=(a,r)=>SP[a.sp].roles.includes(r);
const mult=a=>STAR[a.star-1]*(a.shiny?1.5:1);
const fmt=n=>{if(n<1000)return n<10&&n%1?n.toFixed(1):Math.floor(n)+'';const u=['K','M','B','T','Qa'];let i=-1;while(n>=1000&&i<u.length-1){n/=1000;i++}return n.toFixed(n<10?2:n<100?1:0)+u[i]};
const fmtT=s=>{s=Math.max(0,Math.ceil(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}ชม.${String(m).padStart(2,'0')}น.`:`${m}:${String(x).padStart(2,'0')}`};
const find=uid=>{let i=S.farm.findIndex(a=>a&&a.id===uid);if(i>=0)return{a:S.farm[i],loc:'farm',i};i=S.stash.findIndex(a=>a.id===uid);if(i>=0)return{a:S.stash[i],loc:'stash',i};i=S.away.findIndex(a=>a.id===uid);return i>=0?{a:S.away[i],loc:'away',i}:null};
const nb=i=>{const r=(i/4)|0,c=i%4,o=[];if(r>0)o.push(i-4);if(r<2)o.push(i+4);if(c>0)o.push(i-1);if(c<3)o.push(i+1);return o};
const active=i=>{const a=S.farm[i];return a&&!a.busy&&i<S.unlocked?a:null};
const boostOf=i=>{let b=0;for(const n of nb(i)){const x=active(n);if(x&&has(x,'B'))b+=BOOST[rar(x)]*mult(x)}return b};
const isProducer=a=>!!a&&has(a,'P')&&PR[a.sp]!==undefined;
function haste(role){let h=0;for(let i=0;i<12;i++){const a=active(i);if(a&&has(a,role))h+=HASTE[rar(a)]}return Math.min(.6,h)}
function keepers(f){let h=0;for(let i=0;i<12;i++){const a=active(i);if(a&&has(a,'K'))h+=f[rar(a)]}return h}
const offCap=()=>Math.min(24,4+keepers(OFFH));
const stashCap=()=>12+4*S.stashLvl+keepers(KST);
const slotCost=()=>Math.round(100*Math.pow(2.2,S.unlocked-3));
const stCost=()=>3*(S.stashLvl+1);
const codexN=()=>Object.keys(S.codex).length;
function log(m){S.log.push({t:S.t,m});if(S.log.length>300)S.log.shift();S.msgs.unshift(`[${fmtT(S.t)}] ${m}`);S.msgs.length=Math.min(S.msgs.length,3)}
function discover(i,shiny){
  if(!S.codex[i]){S.codex[i]=1;log(`ค้นพบ ${SP[i].em} ${SP[i].n} (${codexN()}/27)`)}
  if(shiny&&!S.shiny[i]){S.shiny[i]=1;log(`ได้สีพิเศษ ✨ ${SP[i].n}`)}
}
function pushStash(a){
  if(S.stash.length<stashCap()){S.stash.push(a);return true}
  S.ess+=ESS[rar(a)]*a.star;S.coins+=V[rar(a)]*4;log(`ช่องเก็บเต็ม ปล่อย ${sp(a).n} อัตโนมัติ`);return false;
}
const wpick=(arr,w)=>{let t=0;const ws=arr.map(w);ws.forEach(x=>t+=x);let r=Math.random()*t;for(let i=0;i<arr.length;i++){r-=ws[i];if(r<=0)return arr[i]}return arr[arr.length-1]};

const upCost=u=>Math.round(u.cost(U(u.k)));

/* ---------- produce pipeline ---------- */
const bagTotal=()=>{let n=0;for(const k in S.bag)n+=S.bag[k];return n};
const counterTotal=()=>{let n=0;for(const k in S.counter)n+=S.counter[k].n;return n};
function collect(n,manual){
  let moved=0;
  const list=S.farm.map((a,i)=>a).filter(a=>a&&a.pile>0).sort((x,y)=>y.pile-x.pile);
  for(const a of list){
    while(a.pile>0&&moved<n&&bagTotal()<bagCap()){a.pile--;S.bag[a.sp]=(S.bag[a.sp]||0)+1;moved++}
    if(moved>=n||bagTotal()>=bagCap())break;
  }
  if(moved){if(manual)S.mCollect++;else S.aCollect+=moved}
  return moved;
}
function dishOf(items){
  const ids=[...items].sort((x,y)=>x-y),sk='S'+ids.join('-'),sig=SIG[sk];
  const f=items.map(x=>PR[x][0]).sort(),d=new Set(f).size,n=f.length;
  const m=sig?sig.m:(n===2?(d===1?1.4:1.8):(d===1?1.9:d===2?2.3:2.8));
  return{key:sig?sk:f.join(''),val:items.reduce((s,x)=>s+V[SP[x].rar],0)*m,n,sig:!!sig};
}
/* เชฟ: ลองทุกชุดผสมจากของในกระเป๋า เลือกชุดที่ขายได้ราคาดีที่สุดตอนนี้ (รวมสูตรลับ ลูกค้าต้องการ และตลาดอิ่ม) */
function bestMix(){
  const avail=Object.keys(S.bag).map(Number).filter(k=>S.bag[k]>0),cnt=k=>S.bag[k]||0;
  let best=null,bs=-1;
  const consider=items=>{const d=dishOf(items),sc=d.val*satF(d.key)*(isDemand(d.key)?DEMAND_MULT:1);if(sc>bs){bs=sc;best=items}};
  const ok=items=>{const need={};items.forEach(x=>need[x]=(need[x]||0)+1);return Object.keys(need).every(x=>cnt(x)>=need[x])};
  for(let i=0;i<avail.length;i++)for(let j=i;j<avail.length;j++)for(let k=j;k<avail.length;k++){const t=[avail[i],avail[j],avail[k]];if(ok(t))consider(t)}
  if(!best){for(let i=0;i<avail.length;i++)for(let j=i;j<avail.length;j++){const t=[avail[i],avail[j]];if(ok(t))consider(t)}}
  return best||[];
}
function startPot(items,manual){
  const k=S.pots.findIndex((p,i)=>i<potN()&&!p);if(k<0||items.length<2)return false;
  S.pots[k]={items:[...items],start:S.t,end:S.t+COOK_PER_ITEM*items.length*cookMult()};
  if(manual)S.mCook++;else S.aCook++;return true;
}
function finishPot(k){
  const p=S.pots[k],d=dishOf(p.items),c=S.counter[d.key]||(S.counter[d.key]={n:0,sum:0});
  c.n++;c.sum+=d.val;S.pots[k]=null;
  if(!S.dishes[d.key]){S.dishes[d.key]=1;log(`${d.sig?'✨ ค้นพบสูตรลับ':'ค้นพบเมนู'} ${dinfo(d.key)[1]} ${dinfo(d.key)[0]}`)}
}
const isDemand=key=>S.demand.includes(key);
function rollDemand(){const ks=Object.keys(DISH).concat(Object.keys(S.dishes).filter(k=>k[0]==='S'));S.demand=[];while(S.demand.length<3){const k=ks[Math.floor(Math.random()*ks.length)];if(!S.demand.includes(k))S.demand.push(k)}S.demandEnd=S.t+300}
/* ตลาดอิ่ม: ขายเมนูเดิมซ้ำๆ ราคาตกชิ้นละ 7% (ต่ำสุด −50%) แล้วค่อยๆ ฟื้นเมื่อพัก */
const satF=k=>Math.max(.5,1-(S.sat[k]||0));
const reserved=k=>S.order&&S.order.key===k?S.order.n:0;
const sellable=k=>{const c=S.counter[k];return c?Math.max(0,c.n-reserved(k)):0};
const unitAvg=k=>{const c=S.counter[k];return c?c.sum/c.n*priceMult()*(isDemand(k)?DEMAND_MULT:1):0};
const dishAvg=k=>unitAvg(k)*satF(k);
function quote(k,cnt){cnt=Math.min(cnt,sellable(k));let sat=S.sat[k]||0,v=0;const u=unitAvg(k);for(let i=0;i<cnt;i++){v+=u*Math.max(.5,1-sat);sat+=SAT_STEP}return v}
function sellDish(key,cnt,manual){
  const c=S.counter[key];if(!c)return 0;cnt=Math.min(cnt,sellable(key));if(cnt<=0)return 0;
  const v=quote(key,cnt),avg=c.sum/c.n;
  S.sat[key]=(S.sat[key]||0)+SAT_STEP*cnt;
  c.n-=cnt;c.sum-=avg*cnt;if(c.n<=0)delete S.counter[key];
  S.coins+=v;S.earned+=v;S.sold+=cnt;S.sales.push({t:S.t,v});if(manual)S.mSell++;else S.aSell+=cnt;return v;
}
const sellAllValue=()=>{let v=0;for(const k in S.counter)v+=quote(k,1e9);return v};
/* ออเดอร์พิเศษ: ลูกค้าสั่งเมนูที่เคยปรุงแล้ว N จาน จ่าย ×2.5 + 🌿 หมดเวลาไม่มีโทษ ของที่ต้องใช้จะถูกกันไว้ ไม่ถูกขายออก */
function rollOrder(){
  const known=Object.keys(S.dishes),keys=known.length?known:['EM','EE','MM'];
  S.order={key:keys[Math.floor(Math.random()*keys.length)],n:2+Math.floor(Math.random()*3),start:S.t,end:S.t+480};
  log(`📋 ออเดอร์ใหม่: ${dinfo(S.order.key)[1]} ${dinfo(S.order.key)[0]} ×${S.order.n}`);
}
const orderReady=()=>!!S.order&&!!S.counter[S.order.key]&&S.counter[S.order.key].n>=S.order.n;
function fulfillOrder(manual){
  if(!orderReady())return;
  const o=S.order,c=S.counter[o.key],avg=c.sum/c.n,v=avg*o.n*priceMult()*ORDER_MULT;
  c.n-=o.n;c.sum-=avg*o.n;if(c.n<=0)delete S.counter[o.key];
  S.coins+=v;S.earned+=v;S.ess+=1;S.orders++;S.sales.push({t:S.t,v});if(manual)S.mSell++;
  log(`📋 ส่งออเดอร์ ${dinfo(o.key)[1]}×${o.n} +🪙${fmt(v)} +🌿1`);S.order=null;S.orderNext=S.t+45;
}
const rawValue=()=>{let v=0;for(const k in S.bag)v+=V[SP[k].rar]*S.bag[k]*RAW_MULT*priceMult();return v};

/* ---------- simulation ---------- */
function sim(dt){
  S.t+=dt;
  // production
  for(let i=0;i<S.unlocked;i++){
    const a=active(i);if(!isProducer(a))continue;
    if(a.pile>=pileCap()){a.prog=0;continue}
    a.prog+=dt*mult(a)*(1+boostOf(i))/INT[rar(a)];
    if(a.prog>=1){const n=Math.floor(a.prog);a.prog-=n;a.pile=Math.min(pileCap(),a.pile+n);if(a.pile>=pileCap())a.prog=0}
  }
  // drone
  if(U('drone')){S.droneT-=dt;let g=0;while(S.droneT<=0&&g++<5){collect(droneBatch(),false);S.droneT+=droneInt()}if(S.droneT<0)S.droneT=0}
  // pots finish
  for(let k=0;k<4;k++){const p=S.pots[k];if(p&&S.t>=p.end&&counterTotal()<showCap())finishPot(k)}
  // chef
  if(U('chef')&&S.pots.some((p,i)=>i<potN()&&!p)&&counterTotal()+S.pots.filter(Boolean).length<showCap()){
    const tot=bagTotal();
    if(tot>=3||(tot>=2&&(S.chefWait+=dt)>=15)){const mix=bestMix();if(mix.length>=2){mix.forEach(x=>S.bag[x]--);for(const k in S.bag)if(S.bag[k]<=0)delete S.bag[k];if(startPot(mix,false))S.chefWait=0}}
    else if(tot<2)S.chefWait=0;
  }
  // cashier
  if(U('cash')){
    S.cashT-=dt;
    while(S.cashT<=0){
      let best=null,bv=-1;for(const k in S.counter){if(sellable(k)<=0)continue;const v=dishAvg(k);if(v>bv){bv=v;best=k}}
      if(best===null){S.cashT=0;break}
      sellDish(best,1,false);S.cashT+=cashInt();
    }
  }
  // station automation (every ~2s)
  S.autoT+=dt;
  if(S.autoT>=2){S.autoT=0;
    if(U('aRel')&&S.auto.rel&&S.stash.length>=stashCap()-1){mergeAll();releaseExtras(true)}
    if(U('aNur')&&S.auto.nur&&S.nur.end==null&&!S.nur.a&&!S.nur.b&&S.lastPair)tryNursery(S.lastPair[0],S.lastPair[1],false);
    if(U('aExp')&&S.auto.exp&&!S.exp&&!S.crew.length)autoExp();
  }
  // market recovers, orders come and go
  for(const k in S.sat){S.sat[k]-=dt*SAT_DECAY;if(S.sat[k]<=0)delete S.sat[k]}
  if(S.order){
    if(S.t>=S.order.end){log(`📋 ออเดอร์ ${dinfo(S.order.key)[1]} หมดเวลา (ไม่มีโทษ)`);S.order=null;S.orderNext=S.t+30}
    else if(U('cash')&&orderReady())fulfillOrder(false);
  }else if(S.t>=S.orderNext)rollOrder();
  // demand + sales window
  if(S.t>=S.demandEnd)rollDemand();
  while(S.sales.length&&S.sales[0].t<S.t-180)S.sales.shift();
}
function simSpan(g,maxStep){const d=Math.max(maxStep,g/200);let r=g;while(r>1e-9){const x=Math.min(d,r);sim(x);r-=x}}
const perMin=()=>{let v=0;for(const s of S.sales)v+=s.v;return v/3};

/* ---------- nursery ---------- */
function nurInfo(){
  const A=S.nur.a&&find(S.nur.a),B=S.nur.b&&find(S.nur.b);if(!A||!B)return null;
  const same=A.a.sp===B.a.sp,tier=same?rar(A.a):Math.min(4,Math.max(rar(A.a),rar(B.a))+1);
  return{A:A.a,B:B.a,same,tier,cost:NCOST[tier],time:NTIME[tier]*(1-haste('Br'))};
}
const shinyChance=(A,B)=>.05+haste('Br')*.1+((A&&A.shiny)||(B&&B.shiny)?.25:0);
function nurStart(){
  const n=nurInfo();if(!n||S.coins<n.cost||S.nur.end!=null)return;
  S.coins-=n.cost;const key=[n.A.sp,n.B.sp].sort((a,b)=>a-b).join('-');
  let res=n.same?n.A.sp:RC[key]!==undefined?RC[key]:(Math.random()<.5?n.A.sp:n.B.sp);
  Object.assign(S.nur,{key,res,shiny:Math.random()<shinyChance(n.A,n.B),start:S.t,end:S.t+n.time});
  n.A.busy=n.B.busy='nur';S.nursed++;S.lastPair=[n.A.sp,n.B.sp];
}
function nurFinish(){
  const n=S.nur;[n.a,n.b].forEach(u=>{const f=find(u);if(f)giveBack(f.a)});
  const a=mk(n.res);a.shiny=n.shiny;const isRecipe=RC[n.key]===n.res;
  S.stash.push(a);discover(n.res,n.shiny);S.tried[n.key]=n.res;
  if(isRecipe)S.known[n.key]=1;
  log(`ไข่ฟัก: ${SP[n.res].em} ${SP[n.res].n}${n.shiny?' ✨':''}${isRecipe?' (ตรงสูตร)':''}`);
  S.nur={a:null,b:null,end:null};
}

/* ---------- expedition ---------- */
function expStart(){
  const z=ZONES[zoneSel];if(S.exp||!S.crew.length||codexN()<z.need)return;
  const dur=z.dur*(1-haste('S')),crew=S.crew.map(u=>find(u)).filter(Boolean);
  crew.forEach(f=>f.a.busy='exp');
  S.exp={zone:zoneSel,start:S.t,end:S.t+dur,dur,crew:crew.map(f=>f.a.id),cb:crew.reduce((s,f)=>s+rar(f.a),0)};
  S.crew=[];S.explored++;S.lastZone=zoneSel;
}
function expFinish(){
  const e=S.exp,z=e.zone;e.crew.forEach(u=>{const f=find(u);if(f)giveBack(f.a)});
  const n=1+Math.floor(e.crew.length/2);
  for(let k=0;k<n;k++){
    const pool=SP.map((s,i)=>i).filter(i=>SP[i].rar<=z);
    let pick;
    if(z>0&&S.pity>=4)pick=wpick(pool.filter(i=>SP[i].rar===z),()=>1);
    else pick=wpick(pool,i=>{const w=(z>0&&SP[i].rar===z)?.3+.1*e.cb:1;return w*(S.codex[i]?1:3)});
    S.pity=(z>0&&SP[pick].rar===z)?0:S.pity+1;
    const a=mk(pick);discover(pick,false);
    log(`สำรวจ${ZONES[z].n}: พบ ${SP[pick].em} ${SP[pick].n}`);pushStash(a);
  }
  const coins=ZONES[z].coin*(1+.5*e.crew.length);S.coins+=coins;
  let extra=`เหรียญ +${fmt(coins)}`;
  if(Math.random()<.35){
    const unk=Object.keys(RC).filter(k=>!S.known[k]&&!S.codex[RC[k]]);
    if(unk.length){const k=unk[Math.floor(Math.random()*unk.length)];S.known[k]=1;const [x,y]=k.split('-');extra+=`, เบาะแสสูตร ${SP[RC[k]].n} = ${SP[x].n}+${SP[y].n}`}
  }
  if(z>=2){const g=1+z;S.ess+=g;extra+=`, 🌿+${g}`}
  log(`สำรวจ${ZONES[z].n}เสร็จ: ${extra}`);S.exp=null;
}

/* ---------- tick ---------- */
function step(){
  let ch=false;
  if(S.nur.end!=null&&S.t>=S.nur.end&&S.stash.length<stashCap()){nurFinish();ch=true}
  if(S.exp&&S.t>=S.exp.end){expFinish();ch=true}
  return ch;
}
let last=performance.now(), sv=0, lastSig='';
const sig=()=>[bagTotal(),counterTotal(),Math.floor(S.coins),S.pots.map(p=>p?1:0).join(''),S.farm.map(a=>a?a.pile:'-').join(','),S.stash.length].join('|');
function loop(){
  const now=performance.now(),dt=Math.min(600,(now-last)/1000);last=now;
  if(pressed&&!drag&&now-pressedAt>20000)pressed=false;
  simSpan(dt*speed,.5);
  let ch=step();
  const s=sig();if(s!==lastSig&&!pressed){lastSig=s;ch=true}
  if(ch&&!pressed)render();else tickUI();
  sv+=dt;if(sv>5){sv=0;save()}
}
function tickUI(){
  const q=s=>document.getElementById(s);
  q('coins')&&(q('coins').textContent=fmt(S.coins));
  q('pm')&&(q('pm').textContent='~'+fmt(perMin())+'/นาที');
  for(let i=0;i<12;i++){
    const a=S.farm[i],pb=q('pb'+i),pl=q('pl'+i);if(!pb||!a)continue;
    const full=a.pile>=pileCap();pb.style.width=(full?100:Math.min(100,a.prog*100))+'%';
    if(pl)pl.textContent=`📦${a.pile}/${pileCap()}`;
  }
  document.querySelectorAll('[data-e]').forEach(el=>{
    const s=+el.dataset.s,e=+el.dataset.e;
    if(el.classList.contains('t'))el.textContent=fmtT(e-S.t);
    else el.firstElementChild.style.width=Math.min(100,100*(S.t-s)/Math.max(1,e-s))+'%';
  });
  document.querySelectorAll('[data-cost]').forEach(el=>{
    const ok=(el.dataset.cur==='e'?S.ess:S.coins)>=+el.dataset.cost;
    if(el.classList.contains('buy'))el.classList.toggle('no',!ok);else el.disabled=!ok;
  });
}

/* ---------- actions ---------- */
/* animals in the nursery / on an expedition leave the farm and the stash, and go back to where they came from */
function takeAway(a){
  const i=S.farm.indexOf(a);
  if(i>=0){S.farm[i]=null;a.home={loc:'farm',i}}
  else{const j=S.stash.indexOf(a);if(j>=0)S.stash.splice(j,1);a.home={loc:'stash'}}
  if(!S.away.includes(a))S.away.push(a);
}
function giveBack(a){
  const j=S.away.indexOf(a);a.busy=null;if(j<0)return;
  S.away.splice(j,1);const h=a.home;delete a.home;
  if(h&&h.loc==='farm'&&h.i<S.unlocked&&!S.farm[h.i])S.farm[h.i]=a;else S.stash.push(a);
}
function clearPrep(uid){const f=find(uid);if(f&&f.a.busy==='prep')giveBack(f.a)}
function bagAdd(k,n){S.bag[k]=(S.bag[k]||0)+n;if(S.bag[k]<=0)delete S.bag[k]}
function act(a,v){
  S.acts++;v=v===undefined?v:isNaN(+v)?v:+v;
  const cur=sel!=null?find(sel):null;
  switch(a){
  case'tab':tab=tab===v?'':v;break;
  case'sel':sel=sel===v?null:v;break;
  case'slot':{
    if(v>=S.unlocked){if(v===S.unlocked&&S.coins>=slotCost()){S.coins-=slotCost();S.unlocked++;log(`ซื้อช่องฟาร์มที่ ${S.unlocked}`)}break}
    const here=S.farm[v];
    if(here)sel=sel===here.id?null:here.id;
    else if(cur&&cur.loc==='stash'&&!cur.a.busy)placeFarm(cur.a.id,v);
    break}
  case'toStash':if(cur&&cur.loc==='farm'&&!cur.a.busy&&S.stash.length<stashCap()){S.farm[cur.i]=null;S.stash.push(cur.a)}break;
  case'toFarm':if(cur&&cur.loc==='stash'&&!cur.a.busy){const i=S.farm.findIndex((x,j)=>!x&&j<S.unlocked);if(i>=0){S.stash.splice(cur.i,1);S.farm[i]=cur.a}}break;
  case'nurPut':if(cur&&!cur.a.busy){const k=S.nur.a==null?'a':S.nur.b==null?'b':null;if(k&&S.nur.end==null){S.nur[k]=cur.a.id;cur.a.busy='prep';takeAway(cur.a)}}break;
  case'nurCancel':if(S.nur.end==null){clearPrep(S.nur.a);clearPrep(S.nur.b);S.nur={a:null,b:null,end:null}}break;
  case'nurStart':nurStart();break;
  case'crewAdd':if(cur&&cur.loc==='stash'&&!cur.a.busy&&S.crew.length<3){S.crew.push(cur.a.id);cur.a.busy='prep';takeAway(cur.a)}break;
  case'crewDel':if(!S.exp){clearPrep(v);S.crew=S.crew.filter(u=>u!==v)}break;
  case'zone':zoneSel=v;break;
  case'expStart':expStart();break;
  case'merge':if(cur&&cur.a.star<3&&!cur.a.busy){
    const o=[...S.stash,...S.farm.filter(Boolean)].filter(x=>x.id!==cur.a.id&&x.sp===cur.a.sp&&x.star===cur.a.star&&!x.busy);
    if(o.length>=2){o.sort((x,y)=>(S.stash.includes(y)?1:0)-(S.stash.includes(x)?1:0));
      for(const x of o.slice(0,2)){const f=find(x.id);if(f.loc==='stash')S.stash.splice(f.i,1);else S.farm[f.i]=null}
      cur.a.star++;cur.a.shiny=cur.a.shiny||o.slice(0,2).some(x=>x.shiny);log(`รวมดาว ${sp(cur.a).n} เป็น ★${cur.a.star}`)}}break;
  case'release':if(cur&&!cur.a.busy){const a=cur.a;S.coins+=V[rar(a)]*a.star*4;S.ess+=ESS[rar(a)]*a.star;
    if(cur.loc==='farm')S.farm[cur.i]=null;else S.stash.splice(cur.i,1);log(`ปล่อย ${sp(a).n}`);sel=null}break;
  case'bulk':releaseExtras(false);break;
  case'mergeAll':mergeAll();break;
  case'cookAll':{if(S.draft.length>=2&&counterTotal()+S.pots.filter(Boolean).length<showCap()&&startPot(S.draft,true))S.draft=[];while(S.pots.some((p,i)=>i<potN()&&!p)&&bagTotal()>=2&&counterTotal()+S.pots.filter(Boolean).length<showCap()){const m=bestMix();if(m.length<2)break;m.forEach(x=>bagAdd(x,-1));startPot(m,true)}break}
  case'nurRepeat':if(S.lastPair)tryNursery(S.lastPair[0],S.lastPair[1],true);break;
  case'expRepeat':autoExp();break;
  case'tgl':S.auto[v]=!S.auto[v];break;
  case'sort':S.stash.sort((x,y)=>rar(y)-rar(x)||x.sp-y.sp||y.star-x.star);break;
  /* produce pipeline */
  case'collectAll':collect(1e9,true);break;
  case'draftAdd':if(S.draft.length<3&&S.bag[v]>0){bagAdd(v,-1);S.draft.push(v)}break;
  case'draftDel':{const x=S.draft.splice(v,1)[0];if(x!==undefined)bagAdd(x,1);break}
  case'draftAuto':{S.draft.forEach(x=>bagAdd(x,1));S.draft=[];const m=bestMix();m.forEach(x=>bagAdd(x,-1));S.draft=m;break}
  case'cook':if(S.draft.length>=2&&counterTotal()+S.pots.filter(Boolean).length<showCap()&&startPot(S.draft,true))S.draft=[];break;
  case'sellDish':sellDish(v,1e9,true);break;
  case'order':fulfillOrder(true);break;
  case'sellAll':for(const k of Object.keys(S.counter))sellDish(k,1e9,true);break;
  case'sellRaw':{const v2=rawValue();if(v2>0){S.coins+=v2;S.earned+=v2;S.sales.push({t:S.t,v:v2});S.bag={};S.mSell++}break}
  case'up':{const u=UPS.find(x=>x.k===v);if(u&&canBuy(u)){const c=upCost(u);if(u.cur==='e'){S.ess-=c;S.stashLvl++}else{S.coins-=c;S.u[u.k]=U(u.k)+1}log(`อัปเกรด ${u.n} → ${U(u.k)}`)}break}
  case'speed':speed=v;break;
  case'cheat':if(v==='c')S.coins+=Math.max(10000,S.coins);else if(v==='e')S.ess+=20;else if(v==='t')simSpan(3600,1);break;
  case'reset':try{localStorage.removeItem(KEY)}catch(e){}init();sel=null;tab='';break;
  case'copy':{const t=document.getElementById('rep');if(t){t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand&&document.execCommand('copy')}}return}
  }
  step();lastSig=sig();render();
}
// duplicates beyond the best 3 of each species in the stash (shiny and busy animals are never included)
function extras(){const by={};S.stash.filter(a=>!a.busy&&!a.shiny).forEach(a=>(by[a.sp]=by[a.sp]||[]).push(a));let out=[];for(const k in by){by[k].sort((x,y)=>y.star-x.star);out=out.concat(by[k].slice(3))}return out}

/* ---------- render ---------- */
const cell=(a,action,v,extra='',sm=false)=>{
  const s=sp(a);
  return `<button class="cell ${sm?'sm':''} ${sel===a.id?'sel':''} ${a.busy?'busy':''}" style="--rc:var(--r${s.rar})" title="${s.n}" data-a="${action}" data-v="${v}" data-drag="animal:${a.id}" data-gh="${s.em}">
  <span class="em">${s.em}</span>${sm?'':`<span class="nm">${s.n}</span>`}
  <span class="meta">${'★'.repeat(a.star)}${a.shiny?'✨':''}${a.busy?'🔒':''}${s.roles.map(r=>ROLE[r].i).join('')}</span>${extra}</button>`};
function slotHTML(i){
  if(i<S.unlocked){const a=S.farm[i];
    if(!a)return`<button class="cell empty" data-a="slot" data-v="${i}" data-drop="farm:${i}">＋</button>`;
    let extra='',full='';
    if(isProducer(a)){full=a.pile>=pileCap()?'full':'';extra=`<span class="rt" id="pl${i}">📦${a.pile}/${pileCap()}</span><div class="mini"><i id="pb${i}"></i></div>`}
    return cell(a,'slot',i,extra).replace('class="cell ',`class="cell ${full} `).replace('data-a="slot"',`data-drop="farm:${i}" data-a="slot"`)}
  if(i===S.unlocked){const c=slotCost();return`<button class="cell buy ${S.coins>=c?'':'no'}" data-a="slot" data-v="${i}" data-cost="${c}">ซื้อช่อง<br>🪙${fmt(c)}</button>`}
  return`<div class="cell lock">🔒</div>`;
}
function roleText(a){
  const r=rar(a),m=mult(a),o=[];
  if(isProducer(a)){const [f,n,e]=PR[a.sp];o.push(`🪙 ผลิต ${e}${n} ทุก ${(INT[r]/m).toFixed(1)} วิ (มูลค่า ${V[r]})`)}
  if(has(a,'B'))o.push(`📣 เร่งการผลิตช่องข้าง +${Math.round(BOOST[r]*m*100)}%`);
  if(has(a,'Br'))o.push(`💞 ลดเวลาผสม ${Math.round(HASTE[r]*100)}%`);
  if(has(a,'S'))o.push(`🧭 ลดเวลาสำรวจ ${Math.round(HASTE[r]*100)}%`);
  if(has(a,'K'))o.push(`🏠 ออฟไลน์ +${OFFH[r]}ชม. ช่องเก็บ +${KST[r]}`);
  return o.join(' · ');
}

  if(has(a,'Br'))L.push(`<div>💞 <b>ผู้เร่งผสม</b>: ลดเวลาผสมทุกคู่ ${Math.round(HASTE[r]*100)}% · โอกาสสีพิเศษ +${(HASTE[r]*10).toFixed(1)}%${onFarm?'':need}</div>`);
  if(has(a,'S'))L.push(`<div>🧭 <b>ผู้เร่งสำรวจ</b>: ลดเวลาสำรวจ ${Math.round(HASTE[r]*100)}%${onFarm?'':need}</div>`);
  if(has(a,'K'))L.push(`<div>🏠 <b>ผู้เฝ้าฟาร์ม</b>: เพดานออฟไลน์ +${OFFH[r]} ชม. · ช่องเก็บ +${KST[r]}${onFarm?'':need}</div>`);
  const same=[...S.stash,...S.farm.filter(Boolean)].filter(x=>x.sp===a.sp&&x.star===a.star&&!x.busy).length;
  if(a.busy==='prep')b.push(`<span class="sub">เตรียมอยู่ในกล่องโรงผสม/สำรวจ (ลากไปวางที่อื่นเพื่อยกเลิก)</span>`);
  else if(a.busy)b.push(`<span class="sub">🔒 กำลังทำงาน จัดการไม่ได้จนกว่าจะเสร็จ</span>`);
  else{
    if(f.loc==='farm')b.push(`<button class="btn sm" data-a="toStash" ${S.stash.length>=stashCap()?'disabled':''}>เก็บเข้าช่องเก็บ</button>`);
    else b.push(`<button class="btn sm" data-a="toFarm" ${S.farm.findIndex((x,j)=>!x&&j<S.unlocked)<0?'disabled':''}>ลงฟาร์ม</button>`);
    b.push(`<button class="btn sm" data-a="nurPut" ${(S.nur.end!=null||(S.nur.a&&S.nur.b))?'disabled':''}>ใส่โรงผสม</button>`);
    if(f.loc==='stash')b.push(`<button class="btn sm" data-a="crewAdd" ${S.exp||S.crew.length>=3?'disabled':''}>เป็นลูกเรือ</button>`);
    if(a.star<3)b.push(`<button class="btn sm" data-a="merge" ${same>=3?'':'disabled'}>รวมดาว ${Math.min(same,3)}/3</button>`);
    b.push(`<button class="btn sm" data-a="release">ปล่อย +🌿${ESS[r]*a.star}</button>`);
  }
  return`<button class="btn sm x" data-a="sel" data-v="${a.id}" title="ปิด">✕</button>

  <div class="sub">${where}</div>${L.join('')}
  <div class="sub">${s.par?`สูตร: ${SP[s.par[0]].em}${SP[s.par[0]].n} + ${SP[s.par[1]].em}${SP[s.par[1]].n}`:'พบในธรรมชาติ (ได้จากการสำรวจ)'}${a.star<3?` · ดาวเท่ากัน ${Math.min(same,3)}/3 `:' · ดาวสูงสุดแล้ว'}</div>
  <div class="btns">${b.join('')}</div>`;
}
function placePop(){
  const pop=document.getElementById('pop');if(!pop)return;
  const anchor=document.querySelector(`[data-drag="animal:${sel}"]`);
  const pw=pop.offsetWidth,ph=pop.offsetHeight,vw=innerWidth,vh=innerHeight;
  let left=8,top=8;
  if(anchor){
    const r=anchor.getBoundingClientRect();
    left=r.right+8;if(left+pw>vw-8)left=r.left-pw-8;
    if(left<8)left=Math.max(8,Math.min(vw-pw-8,r.left));
    top=Math.max(8,Math.min(vh-ph-8,r.top+r.height/2-ph/2));
  }
  pop.style.left=left+'px';pop.style.top=top+'px';pop.style.visibility='visible';
}

/* skill tree: four lines, each unlocked left to right (a node needs the one before it to be bought at least once) */
const TREE=[
  {n:'🧺 เก็บ',ks:['drone','bag','pile']},
  {n:'🍲 ปรุง',ks:['chef','pot','cook']},
  {n:'💰 ขาย',ks:['price','show','cash','cashSpd']},
  {n:'🐾 สัตว์',ks:['stash','aRel','aExp','aNur']}];
const prereq=u=>{for(const t of TREE){const i=t.ks.indexOf(u.k);if(i>0)return t.ks[i-1]}return null};
const isLocked=u=>{const q=prereq(u);return !!q&&!U(q)};
const canBuy=u=>U(u.k)<u.max&&!isLocked(u)&&(u.cur==='e'?S.ess:S.coins)>=upCost(u);
function nodeHTML(u){
  const l=U(u.k),maxed=l>=u.max,locked=isLocked(u),c=upCost(u),ok=canBuy(u),ic=u.n.split(' ')[0],nm=u.n.slice(ic.length+1),cur=u.cur==='e'?'🌿':'🪙';
  const cls=maxed?'max':locked?'lock':ok?'can':'';
  const pr=maxed?'✓ เต็ม':locked?'🔒 ล็อก':`${u.max>1?`Lv.${l}/${u.max} · `:''}${cur}${fmt(c)}`;
  return`<button class="node ${cls}" title="${nm}: ${u.d()}" data-a="up" data-v="${u.k}" ${locked||maxed?'disabled':`data-cost="${c}" ${u.cur==='e'?'data-cur="e"':''} ${ok?'':'disabled'}`}>
    <span class="ic">${ic}</span><span class="nn">${nm}</span><span class="ef">${u.d()}</span>
    ${u.max>1?`<span class="lvbar"><i style="width:${100*l/u.max}%"></i></span>`:''}<span class="pr">${pr}</span></button>`;
}
function upgradesHTML(){
  const lines=TREE.map(t=>{
    const nodes=t.ks.map((k,i)=>{const u=UPS.find(x=>x.k===k);return(i?`<span class="conn ${U(t.ks[i-1])?'on':''}"></span>`:'')+nodeHTML(u)}).join('');
    return`<div class="tline"><div class="tl-lab">${t.n}</div>${nodes}</div>`;
  }).join('');
  return`<div class="sub">ซื้อทีละขั้นจากซ้ายไปขวา ขั้นที่ปลดล็อกแล้วอัปเกรดต่อได้เรื่อยๆ จนเต็ม</div><div class="tree">${lines}</div>
  <div class="sub">เพดานออฟไลน์ ${offCap().toFixed(1)} ชม. · ระบบอัตโนมัติทำงานตอนปิดเกม ส่วนของที่ต้องกดเองจะค้างไว้</div>`;
}

/* ---------- helpers used by drag-and-drop and the "all / repeat / auto" buttons ---------- */
function placeFarm(uid,i){
  if(i>=S.unlocked)return;const cur=find(uid);if(!cur||cur.a.busy)return;const here=S.farm[i];
  if(here&&(here.id===cur.a.id||here.busy))return;
  if(cur.loc==='stash'){S.stash.splice(cur.i,1);S.farm[i]=cur.a;if(here)S.stash.push(here)}
  else{S.farm[cur.i]=here||null;S.farm[i]=cur.a}
}
function unprep(uid){
  if(S.nur.end==null){if(S.nur.a===uid)S.nur.a=null;if(S.nur.b===uid)S.nur.b=null}
  S.crew=S.crew.filter(u=>u!==uid);clearPrep(uid);
}
function releaseAnimal(uid){
  const f=find(uid);if(!f||f.a.busy)return;const a=f.a;
  S.coins+=V[rar(a)]*a.star*4;S.ess+=ESS[rar(a)]*a.star;
  if(f.loc==='farm')S.farm[f.i]=null;else S.stash.splice(f.i,1);
  if(sel===uid)sel=null;log(`ปล่อย ${sp(a).n}`);
}
function releaseExtras(auto){
  const ex=extras();
  ex.forEach(a=>{S.coins+=V[rar(a)]*a.star*4;S.ess+=ESS[rar(a)]*a.star;const i=S.stash.indexOf(a);if(i>=0)S.stash.splice(i,1);if(sel===a.id)sel=null});
  if(ex.length)log(`${auto?'ปล่อยอัตโนมัติ':'ปล่อยตัวซ้ำ'} ${ex.length} ตัว`);
}
function mergeAll(){
  let n=0;
  for(let again=true;again;){
    again=false;const g={};
    S.stash.filter(a=>!a.busy&&a.star<3).forEach(a=>{const k=a.sp+'-'+a.star;(g[k]=g[k]||[]).push(a)});
    for(const k in g)if(g[k].length>=3){const [a,b,c]=g[k];S.stash=S.stash.filter(x=>x!==b&&x!==c);a.star++;a.shiny=a.shiny||b.shiny||c.shiny;n++;again=true;break}
  }
  if(n)log(`รวมดาว ${n} ครั้ง`);return n;
}
function tryNursery(a,b,manual){
  if(S.nur.end!=null)return false;
  if(S.nur.a||S.nur.b){[S.nur.a,S.nur.b].forEach(u=>u&&clearPrep(u));S.nur={a:null,b:null,end:null}}
  const pool=S.stash.filter(x=>!x.busy),A=pool.find(x=>x.sp===a),B=pool.find(x=>x.sp===b&&x!==A);
  if(!A||!B)return false;
  const tier=A.sp===B.sp?rar(A):Math.min(4,Math.max(rar(A),rar(B))+1);
  if(!manual&&S.coins<NCOST[tier])return false;   // auto mode: don't shuffle animals around if the fee can't be paid
  A.busy=B.busy='prep';takeAway(A);takeAway(B);S.nur.a=A.id;S.nur.b=B.id;
  const n=nurInfo();
  if(n&&S.coins>=n.cost){nurStart();return true}
  return true;
}
function autoExp(){
  if(S.exp)return false;
  const pool=S.stash.filter(x=>!x.busy&&!x.shiny&&x.star===1);if(!pool.length)return false;
  const cnt={};S.stash.forEach(x=>cnt[x.sp]=(cnt[x.sp]||0)+1);
  const crew=pool.sort((x,y)=>(cnt[y.sp]>1?1:0)-(cnt[x.sp]>1?1:0)||rar(x)-rar(y)).slice(0,2);
  S.crew.forEach(clearPrep);S.crew=crew.map(x=>{x.busy='prep';takeAway(x);return x.id});
  let z=Math.min(S.lastZone,4);while(z>0&&codexN()<ZONES[z].need)z--;zoneSel=z;
  expStart();return true;
}

    if(a.busy&&a.busy!=='prep'){log(`${sp(a).n} กำลังทำงานอยู่ ย้ายไม่ได้`);return}
    if(k==='nur'){if(!a.busy&&S.nur.end==null&&!(S.nur.a&&S.nur.b)){S.nur[S.nur.a==null?'a':'b']=a.id;a.busy='prep';takeAway(a)}return}
    if(k==='crew'){
      if(a.busy)return;
      if(f.loc!=='stash'){log('ลูกเรือต้องมาจากช่องเก็บสัตว์');return}
      if(!S.exp&&S.crew.length<3){S.crew.push(a.id);a.busy='prep';takeAway(a)}return;
    }
    if(a.busy==='prep')unprep(a.id);
    if(k==='farm')placeFarm(a.id,+arg);
    else if(k==='stash'){const g=find(a.id);if(g&&g.loc==='farm'&&S.stash.length<stashCap()){S.farm[g.i]=null;S.stash.push(g.a)}}
    else if(k==='release')releaseAnimal(a.id);
  }else if(src.t==='item'){
    if(k==='pot'&&S.draft.length<3&&S.bag[src.v]>0){bagAdd(src.v,-1);S.draft.push(src.v)}
  }else if(src.t==='dish'&&k==='sell')sellDish(src.v,1e9,true);
}

}

function pointerEnd(e,cancel){

    suppress=true;setTimeout(()=>{suppress=false},60);

    }
  }
  dragEnd();
}
